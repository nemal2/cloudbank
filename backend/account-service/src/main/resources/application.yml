server:
  port: 8082

spring:
  application:
    name: account-service

  sql:
    init:
      continue-on-error: false

  datasource:
    # url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/bankdb}
    # url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=${DB_SSL_MODE:require}
    # url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?ssl=true&sslmode=verify-full&sslfactory=org.postgresql.ssl.DefaultJavaSSLFactory
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=require
    # username: ${SPRING_DATASOURCE_USERNAME:bankuser}
    username: ${DB_USER}
    # password: ${SPRING_DATASOURCE_PASSWORD:bankpass}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 8
      connection-timeout: 30000
      initialization-fail-timeout: 60000
      keepalive-time: 30000
      max-lifetime: 1800000
      connection-test-query: SELECT 1

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      password: ${SPRING_REDIS_PASSWORD:redispass}

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

aws:
  s3:
    bucket: ${AWS_S3_BUCKET:bank-profiles}
  endpoint: ${AWS_ENDPOINT:} # blank = real AWS, set to http://minio:9000 for local
  access-key: ${AWS_ACCESS_KEY:}
  secret-key: ${AWS_SECRET_KEY:}
  region: ${AWS_REGION:us-east-1}

jwt:
  secret: ${JWT_SECRET:supersecretjwtkey2024bankingsystem}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

logging:
  level:
    org.springframework.security: DEBUG
    com.bank: DEBUG
