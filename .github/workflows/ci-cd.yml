name: Banking System CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com

jobs:
  # ── Build & Test ─────────────────────────────────────────
  test-backend:
    name: Test Backend Services
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: bankdb_test
          POSTGRES_USER: bankuser
          POSTGRES_PASSWORD: bankpass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Test Transaction Service
        working-directory: backend/transaction-service
        run: mvn test -Dspring.datasource.url=jdbc:postgresql://localhost:5432/bankdb_test

      - name: Test Account Service
        working-directory: backend/account-service
        run: mvn test -Dspring.datasource.url=jdbc:postgresql://localhost:5432/bankdb_test

      - name: Test Auth Service
        working-directory: backend/auth-service
        run: mvn test

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install & test
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build

  # ── Build Docker Images ──────────────────────────────────
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push transaction-service
        run: |
          docker build -t $ECR_REGISTRY/bank-transaction:${{ github.sha }} ./backend/transaction-service
          docker push $ECR_REGISTRY/bank-transaction:${{ github.sha }}
          docker tag $ECR_REGISTRY/bank-transaction:${{ github.sha }} $ECR_REGISTRY/bank-transaction:latest
          docker push $ECR_REGISTRY/bank-transaction:latest

      - name: Build & push account-service
        run: |
          docker build -t $ECR_REGISTRY/bank-account:${{ github.sha }} ./backend/account-service
          docker push $ECR_REGISTRY/bank-account:${{ github.sha }}

      - name: Build & push auth-service
        run: |
          docker build -t $ECR_REGISTRY/bank-auth:${{ github.sha }} ./backend/auth-service
          docker push $ECR_REGISTRY/bank-auth:${{ github.sha }}

      - name: Build & push notification-service
        run: |
          docker build -t $ECR_REGISTRY/bank-notification:${{ github.sha }} ./backend/notification-service
          docker push $ECR_REGISTRY/bank-notification:${{ github.sha }}

      - name: Build & push frontend
        run: |
          docker build -t $ECR_REGISTRY/bank-frontend:${{ github.sha }} ./frontend
          docker push $ECR_REGISTRY/bank-frontend:${{ github.sha }}

  # ── Deploy to AWS ECS ────────────────────────────────────
  deploy:
    name: Deploy to AWS ECS
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy transaction-service to ECS
        run: |
          aws ecs update-service \
            --cluster bank-cluster \
            --service transaction-service \
            --force-new-deployment

      - name: Deploy account-service to ECS
        run: |
          aws ecs update-service \
            --cluster bank-cluster \
            --service account-service \
            --force-new-deployment

      - name: Deploy auth-service to ECS
        run: |
          aws ecs update-service \
            --cluster bank-cluster \
            --service auth-service \
            --force-new-deployment

      - name: Wait for deployment
        run: |
          aws ecs wait services-stable \
            --cluster bank-cluster \
            --services transaction-service account-service auth-service

      - name: Deployment summary
        run: echo "All services deployed successfully to ECS cluster bank-cluster"
