events {
    worker_connections 1024;
}

http {
    # Use Docker's internal DNS resolver
    resolver 127.0.0.11 valid=10s ipv6=off;

    limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=20r/m;

    server {
        listen 80;
        server_name localhost;

        # CORS headers
        add_header Access-Control-Allow-Origin "http://localhost:3000" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-User-Id" always;
        add_header Access-Control-Allow-Credentials "true" always;

        # Handle preflight immediately
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "http://localhost:3000";
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-User-Id";
            add_header Access-Control-Max-Age 1728000;
            add_header Content-Length 0;
            return 204;
        }

        # Auth service
        location /api/v1/auth/ {
            limit_req zone=auth burst=20 nodelay;
            set $auth_upstream http://auth-service:8081;
            proxy_pass $auth_upstream/api/v1/auth/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Account service
        location /api/v1/accounts {
            limit_req zone=api burst=20 nodelay;
            set $account_upstream http://account-service:8082;
            proxy_pass $account_upstream/api/v1/accounts;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Transaction service
        location /api/v1/transactions/ {
            limit_req zone=api burst=20 nodelay;
            set $txn_upstream http://transaction-service:8083;
            proxy_pass $txn_upstream/api/v1/transactions/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Admin routes
        location /api/v1/admin/ {
            limit_req zone=api burst=10 nodelay;
            set $admin_upstream http://account-service:8082;
            proxy_pass $admin_upstream/api/v1/admin/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Health check
        location /health {
            access_log off;
            return 200 '{"status":"UP"}';
            add_header Content-Type application/json;
        }

        # Frontend
        location / {
            set $frontend_upstream http://frontend:3000;
            proxy_pass $frontend_upstream;
            proxy_set_header Host $host;
        }
    }
}