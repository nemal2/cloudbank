server {
    listen 3000;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls to backend services
    location /api/v1/auth/ {
        proxy_pass http://auth-service:8081/api/v1/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Content-Type $content_type;
    }

    location /api/v1/accounts {
        proxy_pass http://account-service:8082/api/v1/accounts;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/v1/transactions/ {
        proxy_pass http://transaction-service:8083/api/v1/transactions/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/v1/admin/ {
        proxy_pass http://account-service:8082/api/v1/admin/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA fallback — all other routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
}